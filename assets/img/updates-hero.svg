    <path d="M192 60v-22M192 374v-22M46 206H24M360 206h-22" stroke="#ffffff" stroke-opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- floating mini cards -->
  <g opacity="0.6" filter="url(#soft2)">
    <rect x="84" y="66" width="86" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="256" y="304" width="104" height="58" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="330" y="96" width="58" height="40" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>

  <!-- glass editor panel -->
  <g>
    <rect x="536" y="78" width="588" height="264" rx="26" fill="url(#glass)" stroke="url(#panelStroke)"/>
    <g clip-path="url(#panelClip)">
      <rect x="536" y="78" width="588" height="264" fill="#0a0c11" fill-opacity="0.28"/>
