<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Абстрактная обложка обновлений VidSlice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080b"/>
      <stop offset="0.55" stop-color="#0c0e13"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(930 90) rotate(125) scale(470 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fb4d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fb4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(280 360) rotate(-30) scale(430 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f7f9a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6f7f9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="540" y1="80" x2="1120" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="540" y1="80" x2="1120" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="230" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbe4f4" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#8ea1c2" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="536" y="78" width="588" height="264" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowA)"/>
  <rect width="1200" height="420" fill="url(#glowB)"/>

  <!-- fine grid -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200"/>
    <path d="M80 0v420M180 0v420M280 0v420M380 0v420M480 0v420M580 0v420M680 0v420M780 0v420M880 0v420M980 0v420M1080 0v420"/>
  </g>

  <!-- light streaks -->
  <g filter="url(#soft2)" opacity="0.8">
    <path d="M-80 386 520 34" stroke="url(#streak)" stroke-width="1.6"/>
    <path d="M-60 430 660 46" stroke="url(#streak)" stroke-width="1" opacity="0.7"/>
    <path d="M620 420 1180 120" stroke="url(#streak)" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- left abstract rings -->
  <g opacity="0.55">
    <circle cx="192" cy="206" r="118" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="192" cy="206" r="74" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="192" cy="206" r="26" stroke="#ffffff" stroke-opacity="0.3"/>
