        <rect x="742" y="140" width="164" height="92" rx="12" fill="#ffffff" fill-opacity="0.075" stroke="#ffffff" stroke-opacity="0.18"/>
        <rect x="918" y="140" width="164" height="92" rx="12" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/>
