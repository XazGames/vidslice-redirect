<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidSlice - редактор видео</title>
  <meta name="theme-color" content="#050506">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css?v=20261123e1">
  <script src="vendor/ffmpeg/ffmpeg.js" defer></script>
  <script src="assets/js/app.js?v=20261123e1" defer></script>
</head>
<body data-page="editor">
  <div class="cursor-glow" aria-hidden="true"></div>
  <canvas class="dot-field" aria-hidden="true"></canvas>

  <main class="shell">
    <div class="toolbar">
      <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> К выбору инструмента</a>
      <div class="brand"><span class="brand__mark">V</span> VidSlice <em>редактор</em></div>
    </div>

    <div class="tool">
      <section class="panel panel--stage">
        <h1 class="panel__title">Видео</h1>
        <p class="panel__hint">Файл не покидает браузер. Можно перетащить видео в область ниже.</p>

        <label class="drop" id="videoDrop" for="videoInput">
          <input id="videoInput" type="file" accept="video/*" hidden>
          <div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15.5v2.2A2.3 2.3 0 0 0 6.3 20h11.4a2.3 2.3 0 0 0 2.3-2.3v-2.2"/></svg>
            <strong data-drop-label>Перетащите видео сюда</strong>
            <span>или нажмите, чтобы выбрать файл - MP4, MOV, WebM, MKV</span>
          </div>
        </label>

        <video id="videoPreview" class="preview" controls playsinline hidden></video>

        <div class="meta">
          <div><span>Файл</span><strong id="videoName">-</strong></div>
          <div><span>Длительность</span><strong id="videoDuration">00:00.00</strong></div>
          <div><span>Обработка</span><strong>локально</strong></div>
        </div>

        <div class="progress" id="videoProgress">
          <div class="progress__bar"><div class="progress__fill" id="videoProgressFill"></div></div>
          <div class="progress__text" id="videoProgressText"></div>
        </div>

        <div class="error" id="videoError"></div>

        <div class="result" id="videoResult">
          <strong>Готово</strong>
          <p id="videoResultText"></p>
          <div class="actions"><button class="btn btn--primary" id="videoDownload" type="button" disabled>Скачать MP4</button></div>
        </div>
      </section>

      <aside class="panel">
        <h2 class="panel__title">Настройки</h2>
        <p class="panel__hint">Выберите кусок, который нужно оставить.</p>

        <div class="field">
          <label for="trimStart">Начало <b id="startValue">00:00.00</b></label>
          <input id="trimStart" type="range" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="field">
          <label for="trimEnd">Конец <b id="endValue">00:00.00</b></label>
          <input id="trimEnd" type="range" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="field">
          <label for="videoQuality">Качество</label>
          <select id="videoQuality">
            <option value="source">Как в исходнике</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
          </select>
        </div>

        <label class="switch">
          <span>Сильнее сжимать файл</span>
          <input id="videoCompress" type="checkbox">
        </label>

        <div class="actions">
          <button class="btn btn--primary" id="exportBtn" type="button" disabled>Собрать MP4</button>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
