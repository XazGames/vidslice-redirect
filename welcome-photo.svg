  <g opacity=".8">
    <rect x="28" y="184" width="304" height="18" rx="9" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="38" y="190" width="96" height="6" rx="3" fill="#ffffff" opacity=".18"/>
    <rect x="142" y="190" width="58" height="6" rx="3" fill="#ffffff" opacity=".12"/>
