<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Иллюстрация сжатия фотографий">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b7b7bd" stop-opacity=".12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="360" height="220" rx="22" fill="url(#bg)"/>
  <circle cx="70" cy="42" r="48" fill="#ffffff" opacity=".05" filter="url(#soft)"/>
  <circle cx="300" cy="186" r="54" fill="#ffffff" opacity=".04" filter="url(#soft)"/>

  <g transform="rotate(-7 126 112)">
    <rect x="44" y="42" width="164" height="126" rx="13" fill="#0b0b0d" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="56" y="54" width="140" height="92" rx="8" fill="url(#glass)"/>
    <circle cx="78" cy="74" r="7" fill="#ffffff" opacity=".45"/>
    <path d="M58 140l40-42 26 26 18-18 54 50z" fill="url(#land)"/>
    <path d="M94 98l18 20 12-11 22 23" fill="none" stroke="#ffffff" stroke-opacity=".30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="rotate(6 226 116)">
    <rect x="146" y="54" width="164" height="126" rx="13" fill="#0d0d0f" stroke="#ffffff" stroke-opacity=".20"/>
    <rect x="158" y="66" width="140" height="92" rx="8" fill="url(#glass)"/>
    <circle cx="180" cy="86" r="7" fill="#ffffff" opacity=".55"/>
    <path d="M160 152l42-44 26 27 18-19 52 49z" fill="url(#land)"/>
    <path d="M198 108l18 21 12-12 22 24" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <circle cx="270" cy="44" r="25" fill="#0e0e10" stroke="#ffffff" stroke-opacity=".20"/>
    <path d="M270 31v18M262 43l8 8 8-8" fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="250" y="66" width="40" height="6" rx="3" fill="#ffffff" opacity=".16"/>
    <rect x="258" y="78" width="24" height="4" rx="2" fill="#ffffff" opacity=".10"/>
