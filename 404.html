<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 - Страница не найдена · VidSlice Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070708;
      --text: #f4f4f5;
      --muted: #9a9aa3;
      --muted-2: #6e6e78;
      --line: rgba(255, 255, 255, 0.12);
      --glow: 255 255 255;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      background:
        radial-gradient(900px 560px at 50% -12%, rgba(var(--glow), 0.1), transparent 62%),
        radial-gradient(700px 460px at 92% 100%, rgba(110, 120, 255, 0.1), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
      pointer-events: none;
    }
    .orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.42;
      pointer-events: none;
      animation: float 14s ease-in-out infinite;
    }
    .orb--1 { top: -140px; left: -100px; background: rgba(var(--glow), 0.18); }
    .orb--2 { bottom: -160px; right: -120px; background: rgba(110, 120, 255, 0.16); animation-delay: -7s; }
    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(26px, 18px, 0) scale(1.08); }
    }
    .wrap {
      position: relative;
      width: min(600px, 100%);
      padding: 34px 30px 28px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
      box-shadow: 0 50px 120px -40px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      backdrop-filter: blur(20px) saturate(150%);
      animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand svg {
      width: 26px;
      height: 26px;
      padding: 5px;
      border-radius: 8px;
      background: var(--text);
      color: #0a0a0c;
    }
    .brand em { color: var(--muted); font-style: normal; font-weight: 600; }

    .art {
      position: relative;
      display: grid;
      place-items: center;
      width: 168px;
      height: 168px;
      margin: 16px auto 4px;
      isolation: isolate;
    }
    .code-ghost {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 0;
      transform: translate(-50%, -50%);
      font-size: clamp(150px, 46vw, 228px);
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -0.07em;
      color: rgba(255, 255, 255, 0.035);
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.14);
      pointer-events: none;
      user-select: none;
      animation: ghost-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes ghost-in {
      from { opacity: 0; transform: translate(-50%, -46%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--glow), 0.16), transparent 68%);
      filter: blur(8px);
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .art svg {
      position: relative;
      z-index: 1;
      width: 106px;
      height: 106px;
      transform: translateY(44px);
      overflow: visible;
      color: #ffffff;
      filter: drop-shadow(0 16px 34px rgba(0, 0, 0, 0.6));
    }
    .art svg .ink { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .art svg .soft { fill: none; stroke: currentColor; opacity: 0.42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .art svg .dot { fill: currentColor; }
    .art__scene { display: none; }
    body[data-code="401"] .art__scene--401,
    body[data-code="403"] .art__scene--403,
    body[data-code="404"] .art__scene--404,
    body[data-code="408"] .art__scene--408,
    body[data-code="410"] .art__scene--410,
    body[data-code="413"] .art__scene--413,
    body[data-code="429"] .art__scene--429,
    body[data-code="500"] .art__scene--500,
    body[data-code="502"] .art__scene--502,
    body[data-code="503"] .art__scene--503,
    body[data-code="504"] .art__scene--504,
    body[data-code="507"] .art__scene--507 { display: block; }
    body:not([data-code="401"]):not([data-code="403"]):not([data-code="404"]):not([data-code="408"]):not([data-code="410"]):not([data-code="413"]):not([data-code="429"]):not([data-code="500"]):not([data-code="502"]):not([data-code="503"]):not([data-code="504"]):not([data-code="507"]) .art__scene--500 { display: block; }

    .svg-anim .ink { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.1s cubic-bezier(0.3, 0.8, 0.2, 1) forwards; }
    .svg-anim .soft { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.2s 0.18s cubic-bezier(0.3, 0.8, 0.2, 1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .code-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.055);
      color: #c9ced8;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
    }
    .code-badge span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.7; }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(21px, 3.6vw, 27px);
      font-weight: 740;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 auto;
      max-width: 390px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }
    .actions--repeat { display: none; }
    body[data-code="408"] .actions--nav,
    body[data-code="429"] .actions--nav,
    body[data-code="500"] .actions--nav,
    body[data-code="502"] .actions--nav,
    body[data-code="503"] .actions--nav,
    body[data-code="504"] .actions--nav { display: none; }
    body[data-code="408"] .actions--repeat,
    body[data-code="429"] .actions--repeat,
    body[data-code="500"] .actions--repeat,
    body[data-code="502"] .actions--repeat,
    body[data-code="503"] .actions--repeat,
    body[data-code="504"] .actions--repeat { display: flex; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 650;
      text-decoration: none;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    .btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.22); }
    .btn:active { transform: scale(0.985); }
    .btn:active svg { transform: scale(0.8) rotate(-7deg); }
    .btn svg { width: 16px; height: 16px; transition: transform 0.2s cubic-bezier(0.2, 1.4, 0.3, 1); }
    .btn--primary {
      border-color: transparent;
      background: var(--text);
      color: #0a0a0c;
    }
    .btn--primary:hover { background: #ffffff; }
    .foot {
      margin-top: 24px;
      color: var(--muted-2);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .wrap { padding: 26px 20px 24px; border-radius: 20px; }
      .art { width: 140px; height: 140px; }
      .art svg { width: 86px; height: 86px; transform: translateY(36px); }
      .actions .btn { flex: 1 1 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .wrap, .art::before, .code-ghost, .svg-anim .ink, .svg-anim .soft { animation: none; }
      .svg-anim .ink, .svg-anim .soft { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body data-code="404">
  <span class="orb orb--1" aria-hidden="true"></span>
  <span class="orb orb--2" aria-hidden="true"></span>

  <main class="wrap">

      VidSlice <em>studio</em>
    </a>

    <div class="art" aria-hidden="true">

        <path class="ink" d="M50 118h50"/>

        <path class="ink" d="M46 116 62 44h10l16 72Z"/>
        <path class="ink" d="M54 84h50"/>

    <h1>Страница не найдена</h1>
    <p>Такой страницы нет. Возможно, ссылка устарела или была удалена вместе со старым проектом.</p>

    <div class="actions actions--nav">
