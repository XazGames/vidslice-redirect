<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ошибка - VidSlice</title>
  <meta name="description" content="VidSlice - обработка видео и фото в браузере.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="VidSlice">
  <meta name="theme-color" content="#050506">
  <link rel="stylesheet" href="/assets/css/app.css?v=20261123g14">
  <link rel="stylesheet" href="/assets/css/mobile-sheets.css?v=20261123m4">
  <link rel="stylesheet" href="/assets/css/site-decor-v2.css?v=20261123d11">
  <link rel="stylesheet" href="/assets/css/share.css?v=20261124s3">
  <script src="/assets/js/app.js?v=20261123g20" defer></script>
  <script src="/assets/js/mobile-sheets.js?v=20261123m4" defer></script>
  <script src="/assets/js/site-decor.js?v=20261123d10" defer></script>
  <script src="/assets/js/share.js?v=20261124s3" defer></script>
</head>
<body data-page="error">
  <div class="cursor-glow" aria-hidden="true"></div>
  <canvas class="dot-field" aria-hidden="true"></canvas>
  <main class="shell error-page">
    <div class="error-page__code" id="errorCode">500</div>
    <h1 id="errorTitle">Что-то пошло не так</h1>
    <p id="errorText">Попробуйте обновить страницу или вернитесь на главную.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/">На главную</a>
      <button class="btn" id="retryBtn" type="button">Попробовать снова</button>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '500';
      var node = document.getElementById('errorCode');
      if (node) node.textContent = code;
      var titles = {
        401: 'Нужна авторизация',
        403: 'Доступ закрыт',
        408: 'Ответ не пришёл',
        410: 'Ссылка больше не работает',
        413: 'Файл слишком большой',
        429: 'Слишком много попыток',
        500: 'Что-то пошло не так',
        502: 'Плочный ответ сервера',
        503: 'Сервис недоступен',
        504: 'Сервер не ответил',
        507: 'Не хватило места'
      };
      var title = document.getElementById('errorTitle');
      if (title && titles[code]) title.textContent = titles[code];
      var retry = document.getElementById('retryBtn');
      if (retry) retry.addEventListener('click', function () { location.reload(); });
    })();
  </script>
</body>
</html>
